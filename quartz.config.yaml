# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: bobby_dreamer
  pageTitleSuffix: " | bobby_dreamer"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: bobbydreamer.xyz
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title: Schibsted Grotesk
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fbfaf7"
        lightgray: "#e6e0d7"
        gray: "#817a71"
        darkgray: "#4b4741"
        dark: "#211f1c"
        secondary: "#92533f"
        tertiary: "#3f7068"
        highlight: rgba(146, 83, 63, 0.12)
        textHighlight: "#f2d58a80"
      darkMode:
        light: "#171817"
        lightgray: "#30332f"
        gray: "#92978f"
        darkgray: "#d4d5cf"
        dark: "#f3f0e8"
        secondary: "#e0a08b"
        tertiary: "#8bbeb2"
        highlight: rgba(224, 160, 139, 0.14)
        textHighlight: "#8d6b2580"
plugins:
  - source: "@bdv/quartz-content-context"
    enabled: true
    layout:
      position: beforeBody
      priority: 25
      condition: blog-article
  - source: "@bdv/quartz-ia-pages"
    enabled: true
    order: 45
  - source: "@bdv/quartz-ia-articles"
    enabled: true
    order: 44
  - source: "@bdv/quartz-ia-header"
    enabled: true
    layout:
      position: header
      priority: 10
  - source: "@bdv/quartz-ia-article-nav"
    enabled: true
    layout:
      position: afterBody
      priority: 10
      condition: numbered-article
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: blog-article
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@bdv/quartz-media"
    enabled: true
    options:
      manifestPath: generated/media-manifest.json
    order: 65
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: false
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.8
        repelForce: 0.6
        centerForce: 0.25
        linkDistance: 35
        fontSize: 0.55
        opacityScale: 0.9
        showTags: true
        removeTags: []
        focusOnHover: true
        enableRadial: false
    layout:
      position: afterBody
      priority: 10
      condition: home-page
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
      condition: article-or-til
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-home-page
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: blog-article
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 30
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true
    layout:
      position: left
      priority: 20
      display: desktop-only
      condition: home-page
  - source: "@quartz-community/spacer"
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      condition: never-render
  - source: "@bdv/quartz-ia-properties"
    enabled: true
    layout:
      position: beforeBody
      priority: 15
      display: all
      condition: blog-article
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    archive:
      exclude:
        - reader-mode
      positions:
        right: []
    article: {}
    canvas: {}
    bases: {}
