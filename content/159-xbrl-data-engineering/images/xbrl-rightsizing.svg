<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">Evidence-preserving XBRL right-sizing</title><desc id="desc">A large embedded presence representation of 1.03 gigabytes becomes a compact catalog of about 79.7 megabytes plus external evidence, while a twelve-hour full rebuild becomes fused incremental processing.</desc><rect width="1200" height="410" fill="#f7f4ed"/><style>.h{font:700 26px system-ui;fill:#162033}.t{font:18px system-ui;fill:#26364d}.big{font:700 42px system-ui;fill:#8b3d1e}.b{fill:#fff;stroke:#52657d;stroke-width:2}.a{stroke:#c45b2c;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#c45b2c"/></marker></defs><text x="40" y="48" class="h">Preserve the evidence; reduce the daily operational weight</text><rect x="55" y="100" width="410" height="200" rx="12" class="b"/><text x="102" y="165" class="big">1.03 GB</text><text x="102" y="205" class="t">embedded per-file presence</text><text x="102" y="250" class="big">12 hours</text><text x="102" y="282" class="t">first recorded v3.1 rebuild</text><rect x="715" y="100" width="430" height="200" rx="12" class="b"/><text x="762" y="165" class="big">~79.7 MB</text><text x="762" y="205" class="t">compact catalog + external evidence</text><text x="762" y="250" class="h">incremental groups</text><text x="762" y="282" class="t">fused stages and changed rematerialization</text><line x1="465" y1="200" x2="700" y2="200" class="a"/><text x="40" y="365" class="t">NEW EXPLANATORY DIAGRAM — the 79.7 MB figure is not the size of the whole XBRL system</text></svg>
