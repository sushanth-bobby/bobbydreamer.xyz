<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Sushanth's modern watchlist workflow</title><desc id="desc">The workflow proceeds from reviewing a company, deciding it is worth retaining, adding it to a specific watchlist with entry context, and later revisiting mainly those companies.</desc><rect width="1200" height="300" fill="#f7f4ed"/><style>.h{font:700 24px system-ui;fill:#162033}.t{font:17px system-ui;fill:#26364d}.b{fill:#fff;stroke:#52657d;stroke-width:2}.a{stroke:#c45b2c;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#c45b2c"/></marker></defs><text x="40" y="45" class="h">Research state follows review, rather than replacing it</text><rect x="45" y="105" width="210" height="90" rx="12" class="b"/><text x="102" y="145" class="h">Review</text><text x="75" y="175" class="t">company evidence</text><rect x="335" y="105" width="210" height="90" rx="12" class="b"/><text x="377" y="145" class="h">Retain?</text><text x="364" y="175" class="t">personal judgement</text><rect x="625" y="105" width="240" height="90" rx="12" class="b"/><text x="662" y="145" class="h">Classify/save</text><text x="660" y="175" class="t">specific list + entry context</text><rect x="945" y="105" width="210" height="90" rx="12" class="b"/><text x="1000" y="145" class="h">Revisit</text><text x="970" y="175" class="t">list + performance</text><line x1="255" y1="150" x2="320" y2="150" class="a"/><line x1="545" y1="150" x2="610" y2="150" class="a"/><line x1="865" y1="150" x2="930" y2="150" class="a"/><text x="40" y="255" class="t">NEW EXPLANATORY DIAGRAM — based on Sushanth's post-Phase-7 workflow recollection</text></svg>

