<rect x="255" y="273" width="225" height="44" rx="6" fill="#e8edf5"/><text x="268" y="301" class="t">Selected company</text>
<text x="268" y="350" class="t">Company</text><text x="268" y="398" class="t">Company</text><text x="268" y="446" class="t">Company</text><text x="268" y="494" class="t">Company</text>
<path d="M263 365 H472 M263 413 H472 M263 461 H472 M263 509 H472" class="rule" fill="none"/>
