<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Kickbear WebApp four-panel model</title>
<desc id="desc">Four panels from left to right: sidebar with reports, listing of reported companies, company details with a chart on top and financials below, and metrics.</desc>
<style>.h{font:700 26px system-ui;fill:#162033}.label{font:700 21px system-ui;fill:#162033}.t{font:17px system-ui;fill:#52657d}.small{font:14px system-ui;fill:#52657d}.b{fill:#fff;stroke:#52657d;stroke-width:2}.rule{stroke:#dde3eb;stroke-width:1}.tag{font:700 14px system-ui;fill:#8b3d1e}</style>
<rect width="1200" height="650" fill="#f7f4ed"/>
<text x="40" y="48" class="h">Kickbear WebApp — four-panel model</text>
<text x="40" y="78" class="t">Reports → reported companies → company details → metrics</text>
<rect x="40" y="110" width="190" height="465" rx="10" class="b"/>
<text x="58" y="140" class="tag">PANEL 1</text><text x="58" y="173" class="label">Sidebar</text><text x="58" y="203" class="t">Reports</text>
